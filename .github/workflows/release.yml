name: Release Play Store
# Construit l'AAB signé à envoyer sur la Play Console (à lancer à la main :
# Actions > Release Play Store > Run workflow). Le numéro de version
# (versionCode) suit le numéro du run, le nom de version suit package.json.
#
# Secrets à créer une fois (Settings > Secrets and variables > Actions),
# voir docs/PLAY-STORE.md :
#   ANDROID_KEYSTORE_BASE64   le fichier .jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe du keystore
#   ANDROID_KEY_ALIAS         alias de la clé
#   ANDROID_KEY_PASSWORD      mot de passe de la clé
# Variable optionnelle : VITE_TELEMETRY_URL (adresse de collecte des statistiques).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_TELEMETRY_URL: ${{ vars.VITE_TELEMETRY_URL }}
      - name: Projet Android (Capacitor)
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Icônes de l'application
        run: cp -r resources/android/res/. android/app/src/main/res/
      - name: Numéro de version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Gradle bundleRelease
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Signer l'AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secrets de signature absents : voir docs/PLAY-STORE.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          cp android/app/build/outputs/bundle/release/app-release.aab IdlePort.aab
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 IdlePort.aab "$KEY_ALIAS"
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: IdlePort-aab
          path: IdlePort.aab
