name: Tests et captures
# À chaque PR : tests Vitest, build, puis captures de chaque onglet sur deux
# tailles de téléphone à partir de l'aéroport de démo (?demo=1).
# Les captures sont jointes au run (artefact « captures »).
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Captures des onglets
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/screens.mjs http://localhost:4173/ captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
